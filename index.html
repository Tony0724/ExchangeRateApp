<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" sizes="16x16"  href="favicon-16x16.png">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="theme-color" content="#ffffff">
  <title>환율 계산기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="borbox">
    
    <!-- 상단 헤더: 제목 + 언어 버튼 -->
    <div class="header">
      <p>환율 계산기</p> 
      <select id="lang-select">
        <option value="ko">한국어</option>
        <option value="en">English</option>
      </select>
    </div>

    <!-- 본문 컨텐츠 -->
    <div class="content">
      
      <!-- 금액 입력 -->
      <label for="amount">가격</label>
      <input id="amount" type="text" inputmode="decimal" placeholder="Enter amount" value="1"/>
      <!-- 라벨 좌우 정렬 -->
      <div class="label-row">
        <label for="from-currency">원래 단위(화폐)</label>
        <label for="to-currency">바꿀 단위(화폐)</label>
      </div>

      <!-- 통화 선택 -->
      <div class="select-row">
        <select id="from-currency">
          <option value="USD">USD</option>
          <option value="KRW">KRW</option>
          <option value="EUR">EUR</option>
        </select>
        <select id="to-currency">
          <option value="KRW">KRW</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
        </select>
      </div>

      <!-- 변환 버튼 -->
      <button id="convert">계산하기</button>

      <!-- 결과 영역 -->
      <div class="result-box">
        <p id="result">환율 계산 결과: </p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://unpkg.com/i18next@23.0.1/i18next.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
